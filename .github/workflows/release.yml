name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # keyless signing with sigstore
  packages: write   # container image on ghcr.io

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: web UI
        working-directory: server/web
        run: npm ci && npm run build
      - name: test
        working-directory: server
        run: go test -count=1 ./...
      - name: binaries and bundles
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG=github.com/mortendnk/portacontrol/server/internal/version
          mkdir -p out
          for arch in amd64 arm64; do
            mkdir -p "build/$arch"
            (cd server && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.Date=$DATE" \
              -o "../build/$arch/" ./cmd/portacontrold ./cmd/portacontrol-cli)
            tar -C "build/$arch" --owner=0 --group=0 --mode=0755 -czf "out/portacontrol-linux-$arch.tar.gz" portacontrold portacontrol-cli
            (cd out && sha256sum "portacontrol-linux-$arch.tar.gz" > "portacontrol-linux-$arch.tar.gz.sha256")
          done
          cp deploy/proxmox/create-lxc.sh out/
      - uses: sigstore/cosign-installer@v3
      - name: sign bundles (keyless)
        run: |
          for f in out/*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > portacontrol-release.jks
            printf 'storeFile=portacontrol-release.jks\nstorePassword=%s\nkeyAlias=portacontrol\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          fi
          V="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew -PversionName="$V" testDebugUnitTest assembleRelease && break; sleep 60; done
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk "../out/portacontrol-android-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  publish:
    needs: [server, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/mortendnk/portacontrol:${{ github.ref_name }}
            ghcr.io/mortendnk/portacontrol:latest
