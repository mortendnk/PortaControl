name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build ./cmd/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The Gradle download sometimes answers 504; retry the build.
      - working-directory: android
        run: chmod +x gradlew && for i in 1 2 3; do ./gradlew testDebugUnitTest assembleDebug && exit 0; sleep 60; done; exit 1

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n deploy/proxmox/create-lxc.sh && shellcheck -S warning deploy/proxmox/create-lxc.sh
